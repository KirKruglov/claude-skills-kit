name: Sync skills to skill-kit.top

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    name: Dispatch catalog update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog.json
        run: |
          if [ ! -f catalog.json ]; then
            echo "catalog.json not found" >&2; exit 1
          fi
          jq -e '. | arrays' catalog.json > /dev/null || {
            echo "catalog.json must be a JSON array" >&2; exit 1
          }
          echo "Catalog OK: $(jq length catalog.json) skills"

      - name: Dispatch to skill-kit.top
        run: |
          payload=$(jq -n \
            --argjson skills "$(cat catalog.json)" \
            '{"event_type": "sync-skills", "client_payload": {"skills": $skills}}')
          echo "$payload" | gh api repos/KirKruglov/skills-kit-top/dispatches \
            --method POST --input -
        env:
          GH_TOKEN: ${{ secrets.WEB_REPO_PAT }}
